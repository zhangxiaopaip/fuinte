# =====================================================================
# Flutify iOS 云构建配置（Codemagic）
#
# 重要前提（务必先读 docs/build-and-signing.md 与仓库 README）：
#   - 官方项目【不支持 iOS】，没有 iOS 的 CI job，也不提交 ios/Podfile。
#     本配置是一次「非官方 iOS 移植」尝试，可能需要在 Mac 上反复调试。
#   - 本项目是 Flutter + Rust（flutter_rust_bridge / cargokit），
#     所以构建机必须装 Rust 工具链 + iOS 编译目标，否则 Rust 后端编不出来。
#   - 项目钉死 Flutter 3.44.x。
#
# 两种签名路线（二选一）：
#   A) 免费路线（推荐先试）：编「未签名 IPA」→ 在你 Windows 上用
#      Sideloadly + 免费 Apple ID 本地重签安装。本文件默认走这条。
#   - 需要你本机装 Sideloadly（sideloadly.com），用普通 Apple ID 登录即可。
#   B) 付费路线：有 $99/年 的 Apple Developer 账号 → 走下方
#      「付费签名」注释块，上传证书/描述文件到 Codemagic。
# =====================================================================

workflows:
  flutify-ios-port:
    name: Flutify iOS（非官方移植）
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      flutter: "3.44.9"          # 与官方 macOS 构建同版本
      xcode: latest
      cocoapods: default
      # —— 付费签名路线 B 才需要（免费路线 A 保持注释）——
      # ios_signing:
      #   distribution_type: development
      #   provisioning_profiles:
      #     - Flutify_Dev

    scripts:
      # 每一步都显式进入克隆目录，避免「Expected to find project root」类错误
      - name: 进入项目目录并自检
        script: |
          cd "$CM_BUILD_DIR" || exit 1
          echo "当前目录: $(pwd)"
          echo "目录内容（前 20 项）:"
          ls -la | head -20
          if [ ! -f pubspec.yaml ]; then
            echo "!!! 错误：克隆目录里没有 pubspec.yaml。"
            echo "!!! 请检查 Codemagic 应用连接的 Repository 是否是 is-hp-is-mad/Flutify（或含完整源码的 fork），分支 main。"
            exit 1
          fi
          echo "pubspec.yaml 存在，OK"

      - name: 安装 Rust 工具链 + iOS 编译目标（cargokit 需要）
        script: |
          cd "$CM_BUILD_DIR" || exit 1
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios        # 真机所需
          rustup target add aarch64-apple-ios-sim    # 模拟器（可选）

      - name: 获取依赖
        script: |
          cd "$CM_BUILD_DIR" || exit 1
          flutter pub get

      - name: 应用音频修复——给 iOS 补 libmpv 后端
        # 根因：main.dart 里 JustAudioMediaKit.ensureInitialized() 会把 just_audio
        # 后端全局换成 media_kit(libmpv)，但原 pubspec 只给 Win/Linux 打包了 libmpv，
        # iOS 缺失 → AudioPlayer 静默失败 → 没声音 + 进度卡 0。补上 iOS/Android 版即可。
        script: |
          cd "$CM_BUILD_DIR" || exit 1
          flutter pub add media_kit_libs_ios_audio media_kit_libs_android_audio
          flutter pub get

      - name: 生成/安装 iOS pods（把 libmpv 等原生库打进 App）
        # 仓库没提交 Podfile，flutter 在首次 build 时会自动生成；这里显式跑一次 pod install。
        script: |
          cd "$CM_BUILD_DIR/ios" || exit 1
          pod install || pod install --repo-update

      - name: 构建未签名 IPA（免费路线 A）
        # 不用 flutter build ipa（那一步强制签名），改为编出未签名的 .app 再手动打包，
        # 之后在你的 Windows 上用 Sideloadly + 免费 Apple ID 重签安装。
        script: |
          cd "$CM_BUILD_DIR" || exit 1
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          flutter build ios --release
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r "$CM_BUILD_DIR/Flutify-unsigned.ipa" Payload
          echo "IPA=$CM_BUILD_DIR/Flutify-unsigned.ipa"

      # —— 付费路线 B 才启用下面这段，并删掉上面的「未签名」段 ——
      # - name: 构建并签名 IPA（付费路线 B）
      #   script: |
      #     flutter build ipa --release

    artifacts:
      - Flutify-unsigned.ipa          # 免费路线 A 的产物
      # - build/ios/ipa/*.ipa         # 付费路线 B 的产物

    publishing:
      email:
        recipients:
          - user@example.com          # 改成你的邮箱，构建完会通知你下载
